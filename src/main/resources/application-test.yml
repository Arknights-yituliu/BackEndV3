#启动端口
server:
  port: 10012

spring:
  #  数据库配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    #  数据库链接
    url: jdbc:mysql://localhost:3306/数据库名?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true
    #  账号
    username: 数据库账号
    #  密码
    password: 数据库密码

  data:
    #reids配置
    redis:
      #  redis所在服务器ip
      host: 127.0.0.1
      #  redis默认端口
      port: 6379
      # password: 有redis密码就放开这个属性填入密码
      database: 0
      connect-timeout: 1800000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 0

#资源路径
resourcesPath:
  penguin: src/main/resources/penguin/
  config: src/main/resources/config/
  backup: src/main/resources/backup/

#AES密匙和签名值
encryption:
  secret: 密匙
  signKey: 签名

#企鹅物流API
penguin:
  auto: 企鹅物流API
  global: https://penguin-stats.io/PenguinStats/api/v2/result/matrix?show_closed_zones=true

tencent:
  secretId: 密匙
  secretKey: 签名
  # 腾讯云邮件推送配置
  email:
    # 发件人地址（需在腾讯云邮件推送控制台验证）
    from-address: 发件人邮箱地址
    # SDK 地域（如 ap-hongkong / ap-guangzhou）
    region: ap-hongkong
    # 邮件模板ID（需在腾讯云控制台创建，模板变量：{{subject}}、{{content}}）
    template-id: 邮件模板ID

# 森空岛API
skland:
  playerInfoAPI: skdAPI
  playerBindingAPI: skdAPI

#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#  是否开启swagger文档
swagger2:
  enable: true

# 统一用户中心接入（直连登录 + 存量登录态迁移）
user-center:
  oauth:
    # UC 服务地址（/oauth2/** 根）；迁移端点仅接受 HTTPS，生产环境必须为 https://
    base-url: http://localhost:8080
    # 客户端 ID（与 UC oauth_client 表 id 一致）
    client-id: arknights-yituliu-web
    # 客户端密钥（明文，妥善保管，仅服务端持有）
    client-secret: arknights-yituliu-web
    # 存量登录态迁移（自签 token → UC 令牌按需兑换），详见 docs/BackEndV3与UC令牌统一方案.md
    migrate:
      # 总开关：默认关闭，上线时显式打开，存量迁移完成后立即关闭
      enabled: false
      # 当前生效的签名私钥标识（对应 UC 侧 kid → 公钥映射表，用于密钥轮换）
      kid: k1
      # Ed25519 签名私钥（PKCS#8 未加密，Base64）；仅本侧持有，严禁进入日志
      # 上线前须改为环境变量注入，测试环境可临时明文填写
      # 对应公钥（配到 UC 侧 verify-keys）：MCowBQYDK2VwAyEA3cSsnnG7Skv8OvgPqOGt/KUUQHJLD7WvYYnwAuDAGfc=
      private-key: "MC4CAQAwBQYDK2VwBCIEIGkrRU0wGpdFXgoqMDTrNamKKXUryXE+01yQRF4DCXwn"
      # 允许的请求时间偏移（秒），须与 UC 侧 clock-skew-seconds 一致
      clock-skew-seconds: 120
      # 来源标识，仅用于 UC 侧审计落库
      origin: backendv3-legacy
      # 单次调用 UC 的超时（秒）：迁移位于请求主链路上，必须短超时避免拖慢业务
      timeout-seconds: 3




